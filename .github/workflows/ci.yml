name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_skills.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: bash -n scripts/team_from_profile.sh
